name: OpenChat Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/openchat-android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/openchat-android-apk.yml'

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare verified APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/OpenChat-v0.1.0-debug.apk
          unzip -t dist/OpenChat-v0.1.0-debug.apk | tail -1
          (cd dist && sha256sum OpenChat-v0.1.0-debug.apk > SHA256SUMS.txt)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenChat-v0.1.0-Android-APK
          path: dist/*
          retention-days: 30
          if-no-files-found: error
