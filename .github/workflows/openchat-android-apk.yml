name: OpenChat Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/openchat-android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/openchat-android-apk.yml'

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # ubuntu-latest already has Android SDK and sdkmanager. Avoid
      # setup-android@v3 on 2026 runners: it attempts obsolete 'tools' package.
      - name: Locate Android SDK manager
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --version
          echo "SDK_MANAGER=$SDK_MANAGER" >> "$GITHUB_ENV"

      - name: Install SDK platform
        run: |
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Bundle OpenChat interface in APK
        run: python3 android/prepare_web_assets.py

      - name: Vendor Supabase JavaScript for reliable startup
        run: |
          set -euo pipefail
          FILE="android/app/src/main/assets/chat/vendor/supabase.min.js"
          mkdir -p "$(dirname "$FILE")"
          if ! curl -fLsS --retry 3 --connect-timeout 15 --max-time 120 \
              "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" -o "$FILE"; then
            curl -fLsS --retry 3 --connect-timeout 15 --max-time 120 \
              "https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js" -o "$FILE"
          fi
          test "$(wc -c < "$FILE")" -gt 50000
          grep -qi supabase "$FILE"

      - name: Build installable debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare verified APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/OpenChat-v0.3.0-debug.apk
          unzip -l dist/OpenChat-v0.3.0-debug.apk | grep -q 'assets/chat/index.html'
          unzip -l dist/OpenChat-v0.3.0-debug.apk | grep -q 'assets/chat/vendor/supabase.min.js'
          unzip -t dist/OpenChat-v0.3.0-debug.apk | tail -1
          (cd dist && sha256sum OpenChat-v0.3.0-debug.apk > SHA256SUMS.txt)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenChat-v0.3.0-Android-APK
          path: dist/*
          retention-days: 30
          if-no-files-found: error
