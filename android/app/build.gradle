plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ugraremkomp.openchat'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ugraremkomp.openchat'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Serve bundled UI from a secure HTTPS origin without requesting GitHub Pages.
    implementation 'androidx.webkit:webkit:1.13.0'
}
